name: Generate Trophy
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate trophies
        uses: ryo-ma/github-profile-trophy@v1
        with:
          username: VedK5643
          theme: flat
          column: 7
          output: profile-trophy.svg

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-trophy.svg
          git diff --staged --quiet || git commit -m "Update trophy SVG"
          git push
